<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grid</title>
<style>
:root{--acc:#0a84ff;--mute:#9a9a9a;--ink:#111;--cw:150px;--top:48px;--ease:cubic-bezier(.22,.9,.3,1);--spring:cubic-bezier(.2,1.1,.3,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:var(--ink);font:12px/1.4 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
html.lock,html.lock body{overflow:hidden;height:100%;overscroll-behavior:none}
html.lock #grid{touch-action:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;transition:color .18s,background-color .18s,transform .22s var(--ease),opacity .2s}
button:hover{color:var(--ink);background:rgba(0,0,0,.05)}
button:active{transform:scale(.88)}
svg{display:block}

/* bar */
.bar{position:fixed;left:0;right:0;top:0;z-index:20;background:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;color:var(--mute);user-select:none;-webkit-user-select:none;animation:barin .7s var(--ease) both}
.bar::after{content:"";position:absolute;left:0;right:0;top:100%;height:16px;background:linear-gradient(#fff,rgba(255,255,255,0));pointer-events:none}
.bar button{height:32px;min-width:32px;padding:0 6px}
.grp{display:inline-flex;align-items:center;gap:0}
.grp .lab{display:flex;margin-right:2px}
.grp b{min-width:24px;text-align:center;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;font-size:13px}
.sp{flex:1}
#status{color:var(--mute);opacity:0;transform:translateY(-4px);transition:opacity .25s,transform .35s var(--ease);font-variant-numeric:tabular-nums}
#status.show{opacity:1;transform:none}
#rangeBtn.on{color:var(--acc);background:rgba(10,132,255,.1)}
#clearRange{display:none;color:var(--acc)}
#exportBtn{color:var(--ink);font-weight:500;gap:6px;padding:0 10px;font-variant-numeric:tabular-nums}
#exportBtn .dim{color:var(--mute);font-weight:400}
#exportBtn[disabled]{pointer-events:none;opacity:.5}
#exportBtn.busy svg{animation:pulse 1s ease-in-out infinite}

/* stage + grid */
#stage{min-height:100vh;padding:calc(var(--top) + 6px) 12px 24px;display:flex;justify-content:center;align-items:flex-start}
html.lock #stage{height:100vh;height:100dvh;min-height:0;padding-bottom:16px;align-items:center}
#wrap{position:relative;width:max-content}
#grid{display:grid;grid-template-columns:repeat(var(--c,3),var(--cw));user-select:none;-webkit-user-select:none}
.cell{position:relative;width:var(--cw);aspect-ratio:1224/1424;overflow:hidden;cursor:pointer}
.cell.filled{cursor:grab}
.cell>*{transition:transform .25s var(--ease),opacity .2s}
.cell:active>*:not(.x){transform:scale(.965)}
.cell.in{animation:cin .5s var(--ease) both;animation-delay:var(--d,0ms)}
.cell.pop img{animation:pop .45s var(--spring)}
.slot{position:absolute;inset:6px;border:1px dashed #d4d4d4;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#c6c6c6;transition:border-color .2s,color .2s,transform .25s var(--ease),background-color .2s}
.cell.empty:hover .slot{border-color:#a0a0a0;color:#8a8a8a;background:rgba(0,0,0,.015)}
.cell img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.cell .x{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:0;opacity:0;transform:scale(.6);transition:opacity .2s,transform .25s var(--ease),background-color .2s;z-index:3}
.cell .x svg{width:12px;height:12px}
.cell .x:hover{background:rgba(0,0,0,.78);color:#fff}
.cell.filled:hover .x{opacity:1;transform:none}
.cell::before{content:"";position:absolute;inset:0;background:rgba(10,132,255,.16);opacity:0;transition:opacity .18s;z-index:2;pointer-events:none}
.cell.over::before{opacity:1}
@media (hover:none){.cell .x{display:none}}
#sel{position:absolute;left:0;top:0;border:2px solid var(--acc);border-radius:2px;background:rgba(10,132,255,.07);pointer-events:none;z-index:5;opacity:0;visibility:hidden;transition:opacity .2s,left .14s var(--ease),top .14s var(--ease),width .14s var(--ease),height .14s var(--ease),visibility 0s .2s}
#sel.on{opacity:1;visibility:visible;transition:opacity .2s,left .14s var(--ease),top .14s var(--ease),width .14s var(--ease),height .14s var(--ease),visibility 0s}
body.range #grid,body.range .cell{cursor:crosshair}

/* gallery */
.gal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.gal[hidden]{display:none}
.gbg{position:absolute;inset:0;background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);opacity:0;transition:opacity .28s}
.gal.open .gbg{opacity:1}
.panel{position:relative;width:min(100%,520px);max-height:min(78vh,680px);display:flex;flex-direction:column;background:#fff;border-radius:22px;box-shadow:0 24px 70px rgba(0,0,0,.16),0 2px 10px rgba(0,0,0,.05);opacity:0;transform:translateY(18px) scale(.96);transition:opacity .22s,transform .38s var(--ease)}
.gal.open .panel{opacity:1;transform:none}
.ghead{display:flex;justify-content:flex-end;gap:2px;padding:8px 8px 0}
.ghead button{width:34px;height:34px;color:var(--mute)}
.gitems{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px 16px 18px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.gitems::-webkit-scrollbar{display:none}
.gt{position:relative;aspect-ratio:1224/1424;border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .28s var(--ease),opacity .25s;-webkit-user-select:none;user-select:none}
.gt img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.gt:hover{transform:scale(1.035)}
.gt:active{transform:scale(.95)}
.gt.cur{outline:2px solid var(--acc);outline-offset:2px}
.gt.gone{transform:scale(.7);opacity:0}
.gt.add{border:1px dashed #d4d4d4;display:flex;align-items:center;justify-content:center;color:#bdbdbd;border-radius:10px;transition:transform .28s var(--ease),color .2s,border-color .2s}
.gt.add:hover{color:#8a8a8a;border-color:#a0a0a0}
.gt .x{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;opacity:0;transform:scale(.6);transition:opacity .2s,transform .25s var(--ease)}
.gt .x svg{width:11px;height:11px}
.gt:hover .x{opacity:1;transform:none}
@media (hover:none){.gt .x{opacity:.9;transform:none}}
.gal.open .gt:not(.still){animation:tin .5s var(--spring) both;animation-delay:var(--d,0ms)}

.ghost{position:fixed;left:0;top:0;width:68px;height:80px;z-index:100;pointer-events:none;border-radius:8px;background-size:cover;background-position:center;opacity:.92;scale:1.06;box-shadow:0 10px 28px rgba(0,0,0,.28);animation:lift .22s var(--ease)}

@keyframes barin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes cin{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes tin{from{opacity:0;transform:translateY(12px) scale(.92)}to{opacity:1;transform:none}}
@keyframes lift{from{opacity:0;scale:.8}to{opacity:.92;scale:1.06}}
@keyframes pulse{50%{opacity:.35;transform:translateY(2px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div class="bar" id="bar">
  <span class="grp"><i class="lab" data-i="cols"></i><button data-dim="cols" data-d="-1" data-i="minus"></button><b id="cv">3</b><button data-dim="cols" data-d="1" data-i="plus"></button></span>
  <span class="grp"><i class="lab" data-i="rows"></i><button data-dim="rows" data-d="-1" data-i="minus"></button><b id="rv">3</b><button data-dim="rows" data-d="1" data-i="plus"></button></span>
  <button id="addBtn" data-i="up" title="画像を追加"></button>
  <span class="grp"><button id="rangeBtn" data-i="range" title="範囲選択 (Shift+ドラッグ)"></button><button id="clearRange" data-i="x"></button></span>
  <span class="sp"></span>
  <span id="status"></span>
  <button id="exportBtn"><span class="dim" id="eCells"></span><span data-i="down"></span><span id="eSize"></span></button>
</div>

<div id="stage"><div id="wrap"><div id="grid"></div><div id="sel"></div></div></div>

<div class="gal" id="gal" hidden>
  <div class="gbg"></div>
  <div class="panel" role="dialog">
    <div class="ghead"><button id="gClear" data-i="trash"></button><button id="gClose" data-i="x"></button></div>
    <div class="gitems" id="gItems"></div>
  </div>
</div>

<input id="fileLib" type="file" accept="image/*" multiple hidden>

<script>
(function(){
const CW=1224, CH=1424, MAXCELLS=100, LOCK_ROWS=4;
const $=s=>document.querySelector(s);
const bar=$('#bar'), grid=$('#grid'), sel=$('#sel'), gal=$('#gal'), gItems=$('#gItems');
const SVG=(p,sz=18,sw=1.6)=>'<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+sw+'" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';
const I={
  plus:SVG('<path d="M12 5v14M5 12h14"/>'),
  minus:SVG('<path d="M5 12h14"/>'),
  up:SVG('<path d="M12 16V5"/><path d="M7.5 9.5 12 5l4.5 4.5"/><path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/>'),
  down:SVG('<path d="M12 4v11"/><path d="M7.5 10.5 12 15l4.5-4.5"/><path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/>'),
  cols:SVG('<path d="M3 12h18"/><path d="M7 8l-4 4 4 4"/><path d="M17 8l4 4-4 4"/>'),
  rows:SVG('<path d="M12 3v18"/><path d="M8 7l4-4 4 4"/><path d="M8 17l4 4 4-4"/>'),
  range:SVG('<rect x="4" y="4" width="16" height="16" rx="3" stroke-dasharray="3 3"/>'),
  x:SVG('<path d="M6 6l12 12M18 6L6 18"/>'),
  trash:SVG('<path d="M5 7h14"/><path d="M10 7V5h4v2"/><path d="M7 7l1 12h8l1-12"/>')
};
document.querySelectorAll('[data-i]').forEach(el=>{el.innerHTML=I[el.dataset.i]||''});

const S={cols:3,rows:3,zoom:150,lib:[],cells:new Map(),range:null,rangeMode:false,gal:null,fresh:new Set(),animAll:true};
let uid=1, suppress=false, busy=false;
const key=(r,c)=>r+','+c;
const byId=id=>S.lib.find(i=>i.id===id);

/* downloads capability */
let dlP=Promise.resolve(null);
try{ if(window.claude&&window.claude.use) dlP=Promise.resolve(window.claude.use('downloads')).catch(()=>null); }catch(e){}

/* persistence: IndexedDB, browser-local */
let db=null, ready=false, metaT=null;
function openDB(){return new Promise(res=>{try{
  const q=indexedDB.open('gridboard',1);
  q.onupgradeneeded=()=>{q.result.createObjectStore('images',{keyPath:'id'});q.result.createObjectStore('meta');};
  q.onsuccess=()=>res(q.result); q.onerror=()=>res(null); q.onblocked=()=>res(null);
}catch(e){res(null)}})}
function tx(store,mode,fn){return new Promise(res=>{
  if(!db) return res(null);
  try{
    const t=db.transaction(store,mode); const req=fn(t.objectStore(store));
    t.oncomplete=()=>res(req&&req.result!==undefined?req.result:true);
    t.onerror=t.onabort=()=>res(null);
  }catch(e){res(null)}
})}
function saveMeta(){
  if(!ready||!db) return;
  clearTimeout(metaT);
  metaT=setTimeout(()=>tx('meta','readwrite',s=>s.put({cols:S.cols,rows:S.rows,cells:[...S.cells],uid},'state')),250);
}

/* status toast */
let stT=null;
function status(msg,ms){
  const el=$('#status'); clearTimeout(stT);
  if(!msg){el.classList.remove('show');return}
  el.textContent=msg; el.classList.add('show');
  if(ms!==0) stT=setTimeout(()=>el.classList.remove('show'),ms||2200);
}

/* layout: rows<=4 → fit to screen & lock scroll, rows>=5 → fit width & scroll */
function fit(){
  const aw=document.documentElement.clientWidth-24;
  const locked=S.rows<=LOCK_ROWS;
  let z=aw/S.cols;
  if(locked){ const ah=innerHeight-bar.offsetHeight-30; z=Math.min(z,ah/S.rows*CW/CH); }
  S.zoom=Math.max(20,Math.min(400,Math.floor(z)));
  document.documentElement.classList.toggle('lock',locked);
  document.documentElement.style.setProperty('--cw',S.zoom+'px');
  if(locked) scrollTo(0,0);
  updateSel();
}
function setSize(dim,v){
  v=Math.max(2,Math.min(20,v|0));
  const other=dim==='cols'?S.rows:S.cols;
  const cap=Math.max(2,Math.floor(MAXCELLS/other));
  if(v>cap){ v=cap; status('≤100'); }
  if(v===S[dim]) return;
  S[dim]=v; S.animAll=true; clampRange(); fit(); render();
}
function clampRange(){
  const R=S.range; if(!R) return;
  if(R.r1>=S.rows||R.c1>=S.cols){S.range=null;return}
  R.r2=Math.min(R.r2,S.rows-1); R.c2=Math.min(R.c2,S.cols-1);
}

/* render */
function render(){
  grid.style.setProperty('--c',S.cols);
  document.body.classList.toggle('range',S.rangeMode);
  const all=S.animAll, fresh=S.fresh; S.animAll=false; S.fresh=new Set();
  const frag=document.createDocumentFragment();
  for(let r=0;r<S.rows;r++)for(let c=0;c<S.cols;c++){
    const d=document.createElement('div'); d.dataset.r=r; d.dataset.c=c;
    const k=key(r,c), id=S.cells.get(k), it=id!=null?byId(id):null;
    if(it){
      d.className='cell filled';
      const im=document.createElement('img'); im.src=it.url; im.alt=''; im.draggable=false;
      const x=document.createElement('button'); x.className='x'; x.innerHTML=I.x;
      d.append(im,x);
    }else{
      d.className='cell empty';
      d.innerHTML='<div class="slot">'+SVG('<path d="M12 6v12M6 12h12"/>',22,1.4)+'</div>';
    }
    if(all){ d.classList.add('in'); d.style.setProperty('--d',Math.min(320,(r*S.cols+c)*16)+'ms'); }
    if(fresh.has(k)) d.classList.add('pop');
    frag.appendChild(d);
  }
  grid.replaceChildren(frag);
  updateSel(); updateBar(); saveMeta();
}
function updateSel(){
  const R=S.range;
  if(!R){sel.classList.remove('on');return}
  const cw=S.zoom, ch=cw*CH/CW;
  sel.style.left=R.c1*cw+'px'; sel.style.top=R.r1*ch+'px';
  sel.style.width=(R.c2-R.c1+1)*cw+'px'; sel.style.height=(R.r2-R.r1+1)*ch+'px';
  sel.classList.add('on');
}
function updateBar(){
  $('#cv').textContent=S.cols; $('#rv').textContent=S.rows;
  const R=S.range||{r1:0,c1:0,r2:S.rows-1,c2:S.cols-1};
  const nc=R.c2-R.c1+1, nr=R.r2-R.r1+1;
  $('#eCells').textContent=S.range?nc+'×'+nr:'';
  $('#eSize').textContent=(nc*CW)+'×'+(nr*CH);
  $('#rangeBtn').classList.toggle('on',S.rangeMode);
  $('#clearRange').style.display=S.range?'inline-flex':'none';
}

/* files → library */
const IMG_RE=/\.(png|jpe?g|webp|gif|avif|bmp)$/i;
async function loadFiles(files){
  const arr=[...files].filter(f=>(f.type&&f.type.startsWith('image/'))||IMG_RE.test(f.name));
  arr.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  const out=[];
  for(let i=0;i<arr.length;i+=8){
    const part=await Promise.all(arr.slice(i,i+8).map(async f=>{
      const url=URL.createObjectURL(f);
      try{
        const img=new Image(); img.src=url; await img.decode();
        const it={id:uid++,name:f.name,url,img,w:img.naturalWidth,h:img.naturalHeight};
        tx('images','readwrite',s=>s.put({id:it.id,name:it.name,blob:f}));
        return it;
      }catch(e){ URL.revokeObjectURL(url); return null; }
    }));
    part.forEach(p=>p&&out.push(p));
  }
  if(out.length<arr.length) status('⚠ '+(arr.length-out.length));
  S.lib.push(...out);
  return out;
}
async function addToLib(files){
  status('…',0);
  const out=await loadFiles(files);
  status(out.length?'+'+out.length:'');
  if(S.gal) buildGallery(false,new Set(out.map(o=>o.id)));
}
$('#fileLib').addEventListener('change',e=>{const f=[...e.target.files]; e.target.value=''; if(f.length) addToLib(f)});
$('#addBtn').addEventListener('click',()=>$('#fileLib').click());

function removeLib(id){
  const it=byId(id); if(!it) return;
  URL.revokeObjectURL(it.url);
  S.lib=S.lib.filter(i=>i.id!==id);
  tx('images','readwrite',s=>s.delete(id));
  [...S.cells].forEach(([k,v])=>{if(v===id)S.cells.delete(k)});
  render();
}
function moveCell(r1,c1,r2,c2){
  const a=S.cells.get(key(r1,c1)), b=S.cells.get(key(r2,c2));
  if(a==null) return;
  S.cells.set(key(r2,c2),a); S.fresh.add(key(r2,c2));
  if(b!=null){ S.cells.set(key(r1,c1),b); S.fresh.add(key(r1,c1)); } else S.cells.delete(key(r1,c1));
}

/* gallery */
function buildGallery(animateAll,newIds){
  const cur=S.gal?S.cells.get(key(S.gal.r,S.gal.c)):null;
  const frag=document.createDocumentFragment();
  const add=document.createElement('button'); add.className='gt add'; add.dataset.act='add'; add.innerHTML=SVG('<path d="M12 5v14M5 12h14"/>',24,1.4);
  add.style.setProperty('--d','0ms'); if(!animateAll) add.classList.add('still');
  frag.appendChild(add);
  S.lib.forEach((it,i)=>{
    const d=document.createElement('div'); d.className='gt'; d.dataset.id=it.id;
    if(it.id===cur) d.classList.add('cur');
    if(!(animateAll||(newIds&&newIds.has(it.id)))) d.classList.add('still');
    d.style.setProperty('--d',Math.min(300,(i+1)*24)+'ms');
    const im=document.createElement('img'); im.src=it.url; im.alt=''; im.draggable=false;
    const x=document.createElement('button'); x.className='x'; x.innerHTML=SVG('<path d="M6 6l12 12M18 6L6 18"/>',11,2);
    d.append(im,x); frag.appendChild(d);
  });
  gItems.replaceChildren(frag);
}
function openGallery(r,c){
  S.gal={r,c};
  buildGallery(true);
  $('#gClear').style.display=S.cells.has(key(r,c))?'inline-flex':'none';
  gal.hidden=false; void gal.offsetWidth; gal.classList.add('open');
  gItems.scrollTop=0;
}
function closeGallery(){
  if(!S.gal) return;
  S.gal=null; gal.classList.remove('open');
  setTimeout(()=>{ if(!S.gal) gal.hidden=true },300);
}
gal.addEventListener('click',e=>{
  if(e.target.closest('#gClose')||e.target.classList.contains('gbg')||e.target===gal){ closeGallery(); return; }
  if(e.target.closest('#gClear')){
    if(S.gal){ S.cells.delete(key(S.gal.r,S.gal.c)); closeGallery(); render(); }
    return;
  }
  const t=e.target.closest('.gt'); if(!t||!S.gal) return;
  if(t.dataset.act==='add'){ $('#fileLib').click(); return; }
  const id=+t.dataset.id;
  if(e.target.closest('.x')){
    t.classList.add('gone');
    setTimeout(()=>{ removeLib(id); if(S.gal) buildGallery(false); },220);
    return;
  }
  const k=key(S.gal.r,S.gal.c);
  S.cells.set(k,id); S.fresh.add(k);
  closeGallery(); render();
});

/* cell clicks */
grid.addEventListener('click',e=>{
  if(suppress||S.rangeMode) return;
  const cell=e.target.closest('.cell'); if(!cell) return;
  const r=+cell.dataset.r, c=+cell.dataset.c;
  if(e.target.closest('.x')){ S.cells.delete(key(r,c)); render(); return; }
  openGallery(r,c);
});

/* pointer: drag cells & range select */
let drag=null, rng=null, ghost=null, overEl=null, timer=null, lx=0, ly=0;
function cellAt(x,y){const el=document.elementFromPoint(x,y);return el&&el.closest?el.closest('.cell'):null}
function setOver(el){
  if(overEl===el) return;
  if(overEl) overEl.classList.remove('over');
  overEl=el; if(el) el.classList.add('over');
}
function setRange(ar,ac,br,bc){
  S.range={r1:Math.min(ar,br),c1:Math.min(ac,bc),r2:Math.max(ar,br),c2:Math.max(ac,bc)};
  updateSel(); updateBar();
}
function track(on){
  const f=on?addEventListener:removeEventListener;
  f.call(window,'pointermove',onMove); f.call(window,'pointerup',onUp); f.call(window,'pointercancel',onCancel);
}
function stopTracking(){
  track(false); clearInterval(timer); timer=null;
  if(ghost){ghost.remove();ghost=null}
  setOver(null);
}
grid.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0) return;
  if(e.target.closest('.x')) return;
  const cell=e.target.closest('.cell'); if(!cell) return;
  const r=+cell.dataset.r, c=+cell.dataset.c;
  lx=e.clientX; ly=e.clientY;
  if(S.rangeMode||e.shiftKey){
    e.preventDefault();
    rng={ar:r,ac:c}; setRange(r,c,r,c); track(true); return;
  }
  const id=S.cells.get(key(r,c));
  if(id!=null){ drag={r,c,id,x0:e.clientX,y0:e.clientY,started:false}; track(true); }
});
function makeGhost(id){
  const it=byId(id); if(!it) return;
  ghost=document.createElement('div'); ghost.className='ghost';
  ghost.style.backgroundImage='url("'+it.url+'")';
  ghost.style.transform='translate('+(lx+10)+'px,'+(ly+10)+'px)';
  document.body.appendChild(ghost);
}
function onMove(e){
  lx=e.clientX; ly=e.clientY;
  if(drag&&!drag.started){
    if(Math.hypot(lx-drag.x0,ly-drag.y0)<6) return;
    drag.started=true; makeGhost(drag.id); timer=setInterval(tick,16);
  }
  if(rng&&!timer) timer=setInterval(tick,16);
  if(ghost) ghost.style.transform='translate('+(lx+10)+'px,'+(ly+10)+'px)';
  update();
}
function update(){
  const cell=cellAt(lx,ly);
  if(rng&&cell) setRange(rng.ar,rng.ac,+cell.dataset.r,+cell.dataset.c);
  if(drag&&drag.started) setOver(cell);
}
function tick(){
  const top=bar.offsetHeight+24, bot=innerHeight-24;
  let dx=0,dy=0;
  if(ly<top) dy=-Math.min(26,(top-ly)/3+2); else if(ly>bot) dy=Math.min(26,(ly-bot)/3+2);
  if(lx<30) dx=-12; else if(lx>innerWidth-30) dx=12;
  if(dx||dy) scrollBy(dx,dy);
  update();
}
function onUp(e){
  lx=e.clientX; ly=e.clientY;
  let did=false;
  if(drag&&drag.started){
    did=true;
    const cell=cellAt(lx,ly);
    if(cell){
      const r=+cell.dataset.r, c=+cell.dataset.c;
      if(!(drag.r===r&&drag.c===c)) moveCell(drag.r,drag.c,r,c);
    }
  }
  if(rng) did=true;
  stopTracking(); drag=null; rng=null;
  if(did){ suppress=true; setTimeout(()=>{suppress=false},0); render(); }
}
function onCancel(){
  const had=!!rng;
  stopTracking(); drag=null; rng=null;
  if(had) render();
}

/* file drop anywhere → library */
const hasFiles=e=>e.dataTransfer&&[...(e.dataTransfer.types||[])].includes('Files');
addEventListener('dragover',e=>{ if(hasFiles(e)) e.preventDefault(); });
addEventListener('drop',e=>{
  if(!hasFiles(e)) return;
  e.preventDefault();
  addToLib([...e.dataTransfer.files]);
});

/* keys */
addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(S.gal){ closeGallery(); return; }
    S.range=null; render();
  }
});

/* toolbar */
bar.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.dim){ setSize(b.dataset.dim,S[b.dataset.dim]+(+b.dataset.d)); return; }
  if(b.id==='rangeBtn'){ S.rangeMode=!S.rangeMode; render(); return; }
  if(b.id==='clearRange'){ S.range=null; render(); return; }
  if(b.id==='exportBtn') doExport();
});

/* export: native pixels, 1224×1424 per cell */
function drawCover(ctx,img,x,y){
  const iw=img.naturalWidth, ih=img.naturalHeight;
  if(iw===CW&&ih===CH){ ctx.drawImage(img,x,y); return; }
  const tr=CW/CH, ir=iw/ih;
  let sw,sh,sx,sy;
  if(ir>tr){ sh=ih; sw=ih*tr; sx=(iw-sw)/2; sy=0; }
  else{ sw=iw; sh=iw/tr; sx=0; sy=(ih-sh)/2; }
  ctx.drawImage(img,sx,sy,sw,sh,x,y,CW,CH);
}
async function saveBlob(blob,name){
  const d=await dlP;
  if(d&&d.save){
    try{ await d.save({filename:name,data:blob}); status('✓'); }
    catch(err){ if(err&&err.code==='declined'){ status('✕'); return; } throw err; }
  }else{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),60000);
    status('✓');
  }
}
async function doExport(){
  if(busy) return;
  const R=S.range||{r1:0,c1:0,r2:S.rows-1,c2:S.cols-1};
  const w=(R.c2-R.c1+1)*CW, h=(R.r2-R.r1+1)*CH;
  const btn=$('#exportBtn');
  busy=true; btn.disabled=true; btn.classList.add('busy'); status('…',0);
  try{
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    const ctx=cv.getContext('2d'); if(!ctx) throw new Error('size');
    ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,w,h);
    ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
    for(let r=R.r1;r<=R.r2;r++){
      for(let c=R.c1;c<=R.c2;c++){
        const id=S.cells.get(key(r,c)), it=id!=null?byId(id):null;
        if(it) drawCover(ctx,it.img,(c-R.c1)*CW,(r-R.r1)*CH);
      }
      await new Promise(res=>setTimeout(res));
    }
    const blob=await new Promise(res=>cv.toBlob(res,'image/png'));
    cv.width=cv.height=1;
    if(!blob) throw new Error('size');
    await saveBlob(blob,'grid_'+w+'x'+h+'.png');
  }catch(err){
    status(err&&err.message==='size'?'⚠ 大きすぎ':'⚠',5000);
  }finally{
    busy=false; btn.disabled=false; btn.classList.remove('busy');
  }
}

/* layout observers */
const ro=new ResizeObserver(()=>{
  document.documentElement.style.setProperty('--top',bar.offsetHeight+'px');
  fit();
});
ro.observe(bar);
addEventListener('resize',fit);

fit(); render();

(async()=>{
  db=await openDB();
  if(!db){ ready=true; status('⚠ 保存不可',5000); return; }
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  const rows=await tx('images','readonly',s=>s.getAll())||[];
  const meta=await tx('meta','readonly',s=>s.get('state'));
  rows.sort((a,b)=>a.id-b.id);
  for(const row of rows){
    const url=URL.createObjectURL(row.blob);
    try{ const img=new Image(); img.src=url; await img.decode();
      S.lib.push({id:row.id,name:row.name,url,img,w:img.naturalWidth,h:img.naturalHeight}); }
    catch(e){ URL.revokeObjectURL(url); }
  }
  uid=Math.max(uid,...rows.map(r=>r.id+1),(meta&&meta.uid)||1);
  if(meta){
    S.cols=Math.max(2,Math.min(20,meta.cols|0||3)); S.rows=Math.max(2,Math.min(20,meta.rows|0||3));
    while(S.cols*S.rows>MAXCELLS) S.rows--;
    S.cells=new Map((meta.cells||[]).filter(([k,id])=>S.lib.some(i=>i.id===id)));
  }
  ready=true; S.animAll=true; fit(); render();
  if(S.lib.length) status('↻ '+S.lib.length);
})();

window.__grid={S,doExport,addToLib};
})();
</script>
